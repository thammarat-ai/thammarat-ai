name: Update Thailand GitHub Rank

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  update-rank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Update Rank using Native Python
        run: |
          python3 -c "
          import urllib.request
          import re

          url = 'https://raw.githubusercontent.com/gayanvoice/top-github-users/main/markdown/public_contributions/thailand.md'
          keywords = ['thammarat-ai', 'thammarat thamma']

          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8')
              
              rank = None
              matched_line = ''
              for line in content.splitlines():
                  # เช็กว่ามี username หรือ Display Name อยู่ในบรรทัดนั้นหรือไม่
                  if any(kw in line.lower() for kw in keywords):
                      matched_line = line
                      # สกัดเอาอันดับ (ตัวเลขในคอลัมน์แรกของตาราง Markdown)
                      match = re.search(r'\|\s*(\d+)\s*\|', line)
                      if match:
                          rank = match.group(1)
                          break

              print(f'Matched Line: {matched_line}')

              if rank:
                  print(f'==> SUCCESS: Found Rank #{rank}')
                  badge = f'[![Thailand GitHub Rank](https://img.shields.io/badge/Thailand_Rank-%23{rank}_Public_Contributions-2E90FA?style=for-the-badge&logo=github&logoColor=white)](https://github.com/gayanvoice/top-github-users/blob/main/markdown/public_contributions/thailand.md)'
              else:
                  print('==> WARNING: User not found in thailand.md list! Using fallback badge.')
                  badge = '[![Thailand GitHub Rank](https://img.shields.io/badge/Thailand_Rank-Top_GitHub_Users-2E90FA?style=for-the-badge&logo=github&logoColor=white)](https://github.com/gayanvoice/top-github-users/blob/main/markdown/public_contributions/thailand.md)'

              with open('README.md', 'r', encoding='utf-8') as f:
                  readme = f.read()

              if '<!-- RANK:START -->' not in readme:
                  print('==> ERROR: <!-- RANK:START --> tag NOT found in README.md!')

              pattern = r'<!-- RANK:START -->.*?<!-- RANK:END -->'
              replacement = f'<!-- RANK:START -->\n{badge}\n<!-- RANK:END -->'
              new_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)

              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_readme)

          except Exception as e:
              print(f'Error occurred: {e}')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update Thailand GitHub rank from gayanvoice" && git push)
