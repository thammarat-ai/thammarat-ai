name: Update Thailand GitHub Rank

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  # บังคับใช้ Node 24 ตามมาตรฐานใหม่ของ GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  update-rank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Update Rank
        run: |
          python3 -c "
          import urllib.request
          import re

          url = 'https://raw.githubusercontent.com/gayanvoice/top-github-users/main/markdown/public_contributions/thailand.md'
          target_user = 'thammarat-ai'

          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8')
              
              rank = None
              for line in content.splitlines():
                  # สแกนหาบรรทัดที่มี username
                  if target_user.lower() in line.lower():
                      # สกัดเอาตัวเลขแรกสุดในบรรทัดตาราง Markdown (| 1 | หรือ | 45 |)
                      match = re.search(r'\|\s*(\d+)\s*\|', line)
                      if match:
                          rank = match.group(1)
                          break

              if rank:
                  badge = f'[![Thailand GitHub Rank](https://img.shields.io/badge/Thailand_Rank-%23{rank}_Public_Contributions-2E90FA?style=for-the-badge&logo=github&logoColor=white)](https://github.com/gayanvoice/top-github-users/blob/main/markdown/public_contributions/thailand.md)'
                  print(f'Successfully found rank: #{rank}')
              else:
                  badge = '[![Thailand GitHub Rank](https://img.shields.io/badge/Thailand_Rank-Top_GitHub_Users-2E90FA?style=for-the-badge&logo=github&logoColor=white)](https://github.com/gayanvoice/top-github-users/blob/main/markdown/public_contributions/thailand.md)'
                  print('User not found in list, fallback used.')

              with open('README.md', 'r', encoding='utf-8') as f:
                  readme = f.read()

              pattern = r'<!-- RANK:START -->.*?<!-- RANK:END -->'
              replacement = f'<!-- RANK:START -->\n{badge}\n<!-- RANK:END -->'
              new_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)

              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_readme)

          except Exception as e:
              print(f'Error occurred: {e}')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update Thailand GitHub rank from gayanvoice" && git push)
